version: '3.8'

services:
  # ============================================================
  # PostgreSQL Database
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: smarteval-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smarteval}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smarteval_password}
      POSTGRES_DB: ${POSTGRES_DB:-smarteval_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smarteval} -d ${POSTGRES_DB:-smarteval_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smarteval-network

  # ============================================================
  # Redis Cache
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: smarteval-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smarteval-network

  # ============================================================
  # AI Service (Python FastAPI)
  # ============================================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: smarteval-ai-service
    environment:
      - PYTHONUNBUFFERED=1
      - AI_USE_MOCK_MODE=${AI_USE_MOCK_MODE:-true}
      - AI_MODEL_CACHE_DIR=/app/models
    ports:
      - "8000:8000"
    volumes:
      - ai-models:/app/models
      - ./uploads:/app/uploads:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ai/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      - redis
    networks:
      - smarteval-network

  # ============================================================
  # Node.js Backend
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smarteval-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_change_in_production}
      JWT_EXPIRES_IN: 7d
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-smarteval}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-smarteval_password}
      DB_NAME: ${POSTGRES_DB:-smarteval_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TTL: 3600
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: 10485760
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TIMEOUT: 60000
      JUDGE0_API_URL: ${JUDGE0_API_URL:-https://ce.judge0.com}
      JUDGE0_API_KEY: ${JUDGE0_API_KEY:-}
      JUDGE0_WAIT_TIME: 2000
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - smarteval-network

  # ============================================================
  # React Frontend
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_AI_SERVICE_URL: http://localhost:8000
    container_name: smarteval-frontend
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - backend
    networks:
      - smarteval-network

# ============================================================
# Networks & Volumes
# ============================================================
networks:
  smarteval-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  ai-models:
